# kitbash MCP surface
#
# Every tool kitbashd exposes over MCP stdio, grouped by family. Tool names are
# <family>_<verb> because MCP tool names allow [A-Za-z0-9_-] only; the dot form
# used in PLAN.md is the same tool spoken aloud.
#
# fs is implemented in M1, pkg and proc in M2, tel in M3, users and approvals in
# M5, secrets in M9. All seven families are declared
# here so the surface is designed as one piece and later milestones fill in the
# implementation without renaming anything.
#
# Besides the families below, every running Process with expose: mcp adds the
# tools its manifest declares under <package>_<tool>, see $package_tools.
#
# initialize answers with instructions, the paragraph that tells a connecting
# agent this host is where the work runs; the text is the Instructions constant
# in internal/server/instructions.go and nowhere else.
#
# Conventions that hold for every tool:
# - Input and output are JSON Schema 2020-12.
# - Paths are absolute, rooted at /org or /home/<caller>. The caller never sees
#   another user's home. Access control is the kernel's: kitbash-mcp runs as the
#   connecting Linux user.
# - A folder is visible only if it carries kitbash.yaml with name and
#   description, and so does every folder between it and its root. kitbash
#   follows no symlinks and refuses every path component that begins with a dot;
#   every open kitbash itself makes below a root resolves with openat2
#   RESOLVE_NO_SYMLINKS and RESOLVE_BENEATH, so a link swapped in at any
#   component during a call is refused by the kernel, not by a check that could
#   race. git is the exception and is scoped rather than hidden: it is handed
#   the repository as a descriptor on the folder that was resolved, but it asks
#   the kernel for that directory as a path and works by the path afterwards, so
#   a folder renamed underneath a running git can still redirect git's own
#   resolution. git runs as the caller, so what that reaches is what the caller
#   could reach with their own git; it is not a way to read or write anything
#   the caller could not.
# - Timestamps are RFC 3339. Identifiers are UUIDv7 unless they are git SHAs or
#   OCI digests.
# - Errors are returned as an MCP tool result with isError: true whose single
#   text content is a JSON object in RFC 9457 Problem Details form, see $error.
# - Every call emits one span into Telemetry with kitbash.user, kitbash.tool
#   and where relevant kitbash.package, kitbash.process and kitbash.path. The
#   span is opened by middleware before the handler runs, so no call is untraced.

version: 1
mcp_protocol: "2025-06-18"

$error:
  description: RFC 9457 Problem Details, plus a fix extension.
  schema:
    type: object
    required: [type, title, status, detail]
    properties:
      type: { type: string, format: uri, description: "Stable URI for the error class, https://kitbash.zyx.tw/errors/<slug>" }
      title: { type: string }
      status: { type: integer, description: "HTTP status semantics: 400 bad input, 403 not permitted, 404 not found, 409 conflict, 413 too large, 415 media type not renderable, 422 manifest invalid, 500 internal" }
      detail: { type: string, description: "What went wrong, specific to this call" }
      instance: { type: string, description: "Path or identifier the error is about" }
      fix: { type: string, description: "What the caller should do next" }
  types:
    - https://kitbash.zyx.tw/errors/not-found
    - https://kitbash.zyx.tw/errors/not-visible        # folder exists but has no manifest
    - https://kitbash.zyx.tw/errors/not-permitted
    - https://kitbash.zyx.tw/errors/bad-request        # malformed input, such as content that is not base64
    - https://kitbash.zyx.tw/errors/invalid-path       # outside /org and /home/<caller>, contains .., names a symlink, or names a dot component
    - https://kitbash.zyx.tw/errors/invalid-manifest   # kitbash.yaml fails spec/manifest.schema.json
    - https://kitbash.zyx.tw/errors/unsupported-media-type  # fs_read cannot render this media type
    - https://kitbash.zyx.tw/errors/too-large
    - https://kitbash.zyx.tw/errors/conflict           # write raced another commit
    - https://kitbash.zyx.tw/errors/queued             # status 202: the call waits in the approval queue; instance is the approval id
    - https://kitbash.zyx.tw/errors/internal

$package_tools:
  description: >
    A Process with expose: mcp puts every tool its manifest declares on the
    owner's surface as <package>_<tool>, with the manifest's input and output
    schemas. Input is validated against the manifest before the call is
    forwarded to the container over podman exec. A tool the server offers but
    the manifest does not declare is not published. Package names equal to a
    family name (fs, pkg, proc, tel, users, approvals, secrets) are refused at
    proc_run.
    Tool names keep the server's spelling (MCP allows [A-Za-z0-9_-]); package names carry no underscore, so the first underscore in a surface name is the split.
    The set is read from the caller's running Processes when a session starts
    and kept current within the session; other sessions see changes when they
    reconnect.
  permits: >
    A Package's manifest may declare provides.permits, the tool name globs and
    absolute path prefixes a Process of that Package may call over /mcp. The
    reserved word packages in permits.tools is exactly the tools described
    here, every <package>_<tool> the caller's running Processes publish, and
    never a built in family tool; a glob matches literal names, built ins
    included.
    pkg_inspect returns the manifest as it is written, so the block is visible
    there; proc_run registers it with the Process, and kitbashd narrows that
    Process's own MCP sessions to it, see mcp_for_processes.permits in
    spec/kitbashd-api.yaml and PLAN.md section 2.3. A session a member opens
    over SSH is narrowed by nothing, so every tool below is described as that
    member reads it.
  errors: [bad-request, not-found, internal, and any problem the Package itself returns]
  package_errors: >
    When a Package tool answers isError with a single text block that parses
    as problem details of a kitbash type, the surface returns that problem
    unchanged, so a kit's own not-found or too-large reaches the agent as is.
    The classes a Package may claim are not-found, bad-request, not-permitted,
    invalid-path, invalid-manifest, unsupported-media-type, too-large, conflict
    and internal, each with the status that class carries; invalid-path is
    there because a Package given a path of its own, such as an import-cli
    Package whose unit mounts a folder of Files, answers about that path in the
    same vocabulary the fs family does. The two a Package may not claim are
    queued, which is the approval answer and would say an admin is about to run
    a call that was never queued, and not-visible, which is the surface's own
    reading of a folder. A problem of any other class, a status that does not
    match its class, a document carrying a field the surface does not define,
    and any other error text are wrapped as bad-request with the text as
    detail.
  import_hook:
    description: >
      The contract an import kit implements. The kit's manifest declares
      provides.kit: [import] and a tool named import whose input has a source
      string constrained by pattern to the syntax the kit understands.
      pkg_import picks the running kit whose import input schema accepts the
      source and writes the files it returns into the target folder as one
      commit.
    input:
      type: object
      required: [source]
      properties:
        source: { type: string, description: "Constrained by pattern, for example ^npm:" }
    output:
      type: object
      required: [files]
      properties:
        files: { type: array, minItems: 1, items: { $ref: "#/$defs/importFile" } }
  build_hook:
    description: >
      The contract a build kit implements. The kit's manifest declares
      provides.kit: [build] and a tool named build. A Package is built by that
      kit when its container unit carries builder: <package path>; without the
      field the built in OCI path builds it, which is every manifest written
      before this existed. pkg_build resolves the commit and the build context
      first, because kitbash builds from a commit and a Package cannot reach
      outside its own tree whoever does the building, and then calls the kit
      with the Package folder and that context. The digest the kit answers with
      is the Package version and the log tail is the one log record per build.
      A named kit that is not running is not-found; one whose build tool does
      not accept the hook's arguments is invalid-manifest. A build a kit made
      elsewhere is not recorded with kitbashd, because a record is a claim
      about an image in the recording member's own store.
    input:
      type: object
      required: [path, context]
      properties:
        path: { type: string, description: "Absolute path of the Package folder" }
        context: { type: string, description: "Absolute path of the build context inside that folder" }
    output:
      type: object
      required: [digest]
      properties:
        digest: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        log: { type: string, description: "Build log; kitbash returns only its tail" }
  run_hook:
    description: >
      The contract a run kit implements. The kit's manifest declares
      provides.kit: [run] and a tool named run, and optionally a tool named
      stop whose input is the Process id. A Package is started by that kit when
      its container unit carries runner: <package path>; without the field the
      built in rootless podman runner starts it. proc_run calls the kit with
      the Package path, the digest to run, the Process name and the container
      unit as the manifest wrote it, and registers the id, state and endpoint
      it answers with as the Process. The id is the Process id everywhere else,
      so it is a UUIDv7. The kit is the one that converges: it is called with
      the same Package and name every time, and a run that answers with a new
      id has replaced the Process of that name, whose registration is dropped. The kit owns what it started: kitbashd registers the
      Process, mints its Telemetry token and lists it, and does not start,
      stop, restore or probe it. proc_stop forwards to the kit's stop tool, and
      a kit that declares none owns a Process kitbash answers not-permitted
      for. An endpoint that is not on this host's loopback address is reported
      to the caller and not registered, because the Telemetry fan out is POSTed
      to what is registered. A named kit that is not running is not-found; one
      whose run tool does not accept the hook's arguments is invalid-manifest.
    input:
      type: object
      required: [package, digest, name, unit]
      properties:
        package: { type: string, description: "Absolute path of the Package folder" }
        digest: { type: string, description: "OCI image id to run" }
        name: { type: string, description: "Process name, the manifest's name by default" }
        unit: { type: object, description: "deploy.units[0] as the manifest wrote it" }
    output:
      type: object
      required: [id, state]
      properties:
        id: { type: string, description: "Process id, a UUIDv7" }
        state: { type: string, enum: [starting, running, unhealthy, stopped, failed] }
        endpoint: { type: string, description: "Where the Process is reachable, empty when it is not" }

$defs:
  folderEntry:
    type: object
    required: [path, name]
    properties:
      path: { type: string }
      name: { type: string }
      description: { type: string, description: "From the folder's own kitbash.yaml; absent for a folder inside a Package, which the Package describes" }
  fileEntry:
    type: object
    required: [name, size]
    properties:
      name: { type: string }
      size: { type: integer }
  writeFile:
    description: One file of an fs_write that carries a list. Exactly one of content and contentBase64 is set.
    type: object
    additionalProperties: false
    required: [path]
    oneOf:
      - required: [content]
      - required: [contentBase64]
    properties:
      path: { type: string, description: "Absolute path, under the same top level folder as every other file of this call" }
      content: { type: string, description: "UTF-8 text" }
      contentBase64: { type: string, contentEncoding: base64 }
  importFile:
    description: One file an import kit hands back. Exactly one of content and contentBase64 is set.
    type: object
    required: [path]
    properties:
      path: { type: string, description: "Relative to the target folder, no leading slash, no dot component" }
      content: { type: string, description: "UTF-8 text" }
      contentBase64: { type: string, contentEncoding: base64 }
  telAttributes:
    description: The four attributes plus tool, eval and internal, in short form. Absent when the record did not carry them.
    type: object
    properties:
      user: { type: string }
      package: { type: string }
      process: { type: string }
      path: { type: string }
      tool: { type: string }
      eval: { type: boolean }
      producer: { type: string, description: "Member name or Process id that wrote the record" }
      caller: { type: string, description: "Process id whose MCP session recorded this span, when a Process acted for its owner" }
      internal: { type: boolean, description: "true when the record is the cause of an internal problem; admins alone are answered these" }
      subject: { type: object, description: "For evaluation records: traceId and spanId of the judged span", properties: { traceId: { type: string }, spanId: { type: string } } }
  spanRecord:
    type: object
    required: [traceId, spanId, name, start, end, status, attributes]
    properties:
      traceId: { type: string, pattern: "^[a-f0-9]{32}$" }
      spanId: { type: string, pattern: "^[a-f0-9]{16}$" }
      parentSpanId: { type: string, pattern: "^[a-f0-9]{16}$" }
      name: { type: string, description: "Tool name for surface spans, build or run for children" }
      start: { type: string, format: date-time }
      end: { type: string, format: date-time }
      durationMs: { type: number }
      status: { type: string, enum: [ok, error, unset] }
      statusMessage: { type: string }
      attributes: { $ref: "#/$defs/telAttributes" }
      other: { type: object, description: "Remaining span attributes by their wire name" }
  logRecord:
    type: object
    required: [time, severity, body, attributes]
    properties:
      time: { type: string, format: date-time }
      severity: { type: string }
      body: { type: string }
      traceId: { type: string }
      spanId: { type: string }
      attributes: { $ref: "#/$defs/telAttributes" }
      other: { type: object }
  metricRecord:
    type: object
    required: [time, name, value, attributes]
    properties:
      time: { type: string, format: date-time }
      name: { type: string }
      value: { type: number }
      unit: { type: string }
      attributes: { $ref: "#/$defs/telAttributes" }
      other: { type: object }
  commit:
    type: object
    required: [sha, author, time, message]
    properties:
      sha: { type: string, pattern: "^[a-f0-9]{40}$" }
      author: { type: string, description: "Linux user name" }
      time: { type: string, format: date-time }
      message: { type: string }

families:

  # ---------------------------------------------------------------- fs (M1)
  fs:
    description: Files. Every top level folder under /org and /home/<caller> is a git repository.
    implemented_in: M1
    tools:

      fs_list:
        description: >
          List what is visible at a path. With no path, returns the visible top
          level folders across /org and the caller's home, one line of path,
          name and description each and no files. A root path itself is the
          same roots view of that root: /org and /home/<caller> carry no
          manifest and are always listable, returning their visible children.
          A top level folder is visible only by a manifest of its own, because
          there is nothing above it to inherit one from.
          Inside any other folder, returns its subfolders and the files
          directly in it, each file as a name and a size. A folder is visible
          when it or a folder above it carries a kitbash.yaml with a name and a
          description, so the folders inside a Package are listed and need no
          manifest of their own; one that carries a manifest is described by
          it, and one that does not is listed by its own name. The manifest in
          the answer is the one this folder carries itself, absent at the roots
          and inside a Package. Every folder with no manifest anywhere above it
          is omitted.
        input:
          type: object
          additionalProperties: false
          properties:
            path: { type: string, description: "Absolute folder path. Omit for the roots." }
        output:
          type: object
          required: [path, folders]
          properties:
            path: { type: string }
            manifest: { description: "The kitbash.yaml this folder carries itself, absent at the roots and inside a Package", type: object }
            folders: { type: array, items: { $ref: "#/$defs/folderEntry" } }
            files: { type: array, description: "The files directly in this folder, absent at the roots and for a folder that holds none", items: { $ref: "#/$defs/fileEntry" } }
        errors: [not-found, not-visible, not-permitted, invalid-path, internal]

      fs_read:
        description: >
          Read one file. Text media types return text content. image/png and
          image/jpeg return MCP image content. application/pdf returns extracted
          text in M1. Files larger than 1 MiB return too-large; use offset and
          limit for text.
        input:
          type: object
          additionalProperties: false
          required: [path]
          properties:
            path: { type: string }
            offset: { type: integer, minimum: 0, description: "Byte offset for text files" }
            limit: { type: integer, minimum: 1, maximum: 1048576, description: "Max bytes for text files" }
        output:
          description: >
            Content blocks only. fs_read declares no outputSchema and returns no
            structuredContent, because clients prefer structuredContent when it
            is present and would then show the caller the metadata instead of
            the file body. The first block is the file: text media types as a
            text block, image/png and image/jpeg as an image block. The trailing
            block is a text block holding this metadata object as JSON.
          type: object
          required: [path, mediaType, size]
          properties:
            path: { type: string }
            mediaType: { type: string }
            size: { type: integer }
            sha: { type: string, description: "Commit that last touched this file" }
            truncated: { type: boolean }
        errors: [not-found, not-visible, not-permitted, invalid-path, unsupported-media-type, too-large, internal]

      fs_write:
        description: >
          Create or replace files and commit them to the enclosing top level
          repository, attributed to the caller. Either one file named by path
          with content or contentBase64, or up to 64 of them in files, all
          under one top level folder and 16 MiB in total; either way the call
          is one commit, because a Package is several files that belong
          together and the history should say so. A call carrying both forms is
          bad-request, and so is one whose files name two top level folders or
          name one path twice.
          Writing kitbash.yaml into a new folder is how a folder becomes
          visible, and the folders inside it need no manifest of their own; a
          manifest is written into a visible folder or into a root, and it is
          validated against spec/manifest.schema.json before commit. A manifest
          in the same list counts as written while the list is judged, so one
          call writes a Package's kitbash.yaml and the files beneath it in any
          order. Binary content is base64. Pass expectedSha to refuse the write
          if the file, or for a list the repository's head, changed since it was
          read.
          A list is refused whole: one path the caller may not write is a call
          that did not happen, and nothing of it reaches the disk.
          A member writing under /org does not fail: the call is queued for
          an admin as one approval whatever it carries, and the result is a
          queued problem (202) whose instance is the approval id;
          approvals_list shows the outcome once an admin decides.
        input:
          type: object
          additionalProperties: false
          required: [message]
          oneOf:
            - required: [path]
              not: { required: [files] }
              oneOf:
                - required: [content]
                - required: [contentBase64]
            - required: [files]
              not:
                anyOf:
                  - required: [path]
                  - required: [content]
                  - required: [contentBase64]
          properties:
            path: { type: string }
            content: { type: string, description: "UTF-8 text" }
            contentBase64: { type: string, contentEncoding: base64 }
            files:
              type: array
              minItems: 1
              maxItems: 64
              description: "Several files as one commit, all under one top level folder, 16 MiB in total"
              items: { $ref: "#/$defs/writeFile" }
            message: { type: string, minLength: 3, maxLength: 200, description: "Commit message, imperative mood" }
            expectedSha: { type: string, description: "Last known commit sha; optimistic lock, read against the file for one path and against the repository head for a list" }
        output:
          type: object
          required: [commit]
          oneOf:
            - required: [path]
            - required: [paths]
          properties:
            path: { type: string, description: "The file that was written, for the one file form" }
            paths: { type: array, items: { type: string }, description: "The files that were written, for a list" }
            commit: { $ref: "#/$defs/commit" }
        errors: [bad-request, not-visible, not-permitted, invalid-path, invalid-manifest, too-large, conflict, queued, internal]

      fs_history:
        description: List commits that touched a path, newest first.
        input:
          type: object
          additionalProperties: false
          required: [path]
          properties:
            path: { type: string }
            limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
        output:
          type: object
          required: [path, commits]
          properties:
            path: { type: string }
            commits: { type: array, items: { $ref: "#/$defs/commit" } }
        errors: [not-found, not-visible, not-permitted, invalid-path, internal]

  # ---------------------------------------------------------------- pkg (M2)
  pkg:
    description: Packages. A folder with a deploy block, built to or imported as an OCI image.
    implemented_in: M2
    tools:
      pkg_build:
        description: >
          Build the Package at path from its current commit with the caller's
          rootless container runtime. The digest is the OCI image ID. The image
          is labelled kitbash.path, kitbash.name, kitbash.commit and
          kitbash.user, which is the whole build record. Only the tail of the
          build log is returned, its last 20 lines and at most 2 KiB; the full
          log never leaves the host. A build
          that runs and fails is bad-request carrying that same tail, because
          the build context is the caller's to fix; a runtime that will not run
          at all is internal. An uncommitted change under the path is conflict:
          kitbash builds from a commit. Version 1 supports one container unit
          per Package. A unit with build is built from its context; a unit
          with image is pulled by digest and relabelled through a one line
          Containerfile so the result carries the same labels and its own
          image ID.

          For a Package under /org the builds kitbashd recorded for this commit
          are read first, so one commit is one digest for every member: an
          image of that commit already in the caller's store is returned as it
          is with the log line "already built at <digest>", one another member
          has is copied into the caller's store with the log line "copied from
          <builder>", and only a commit nobody has built is built. When several
          digests are recorded for one commit the earliest record wins, so
          every member picks the same one. An image is accepted, held or
          copied, only when its own kitbash.path and kitbash.commit labels are
          this Package at this commit: a record is a claim another member
          wrote, and the labels are what the build stamped inside the image.
          Anything else, an image whose labels do not match included, falls
          back to building. A build that did run is recorded, and a record
          kitbashd refuses costs nothing but the record. Packages in a home are
          neither recorded nor copied. See PLAN.md section 2.2.

          A unit whose builder names a Package folder is built by that kit
          instead of by the built in path, see $package_tools.build_hook. The
          kit has to be running as a Process of the caller: a builder that is
          not is not-found, and a build tool whose schema does not accept the
          hook's arguments is invalid-manifest.
        input: { type: object, additionalProperties: false, required: [path], properties: { path: { type: string } } }
        output:
          type: object
          required: [path, digest, commit]
          properties:
            path: { type: string }
            digest: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
            commit: { type: string, pattern: "^[a-f0-9]{40}$" }
            log: { type: string, description: "Tail of the build log" }
        errors: [bad-request, not-found, not-visible, not-permitted, invalid-path, invalid-manifest, conflict, internal]
      pkg_import:
        description: >
          Wrap something external as a Package folder at path using a running
          import kit, see $package_tools.import_hook. Writes the folder as one
          commit, does not build. The target folder must not exist yet. Returns
          not-found when no running kit accepts the source and conflict when
          more than one does.
        input:
          type: object
          additionalProperties: false
          required: [path, source]
          properties:
            path: { type: string, description: "New folder to create" }
            source: { type: string, description: "npm:<pkg>@<ver> today; oci://<ref>@sha256:... and pypi:<pkg>==<ver> once their kits exist" }
        output: { type: object, required: [path, commit], properties: { path: { type: string }, commit: { $ref: "#/$defs/commit" } } }
        errors: [bad-request, not-found, not-permitted, invalid-path, invalid-manifest, conflict, too-large, queued, internal]
      pkg_list:
        description: >
          Packages visible to the caller: path, name and the digest of the
          latest build, if any. Walks the visible folders under /org and the
          caller's home and keeps those whose manifest carries a deploy block,
          and enters only folders that carry a manifest of their own, so the
          folders inside a Package are not walked. When a Package was built is
          pkg_inspect's answer and how many Processes it has is proc_list's, so
          neither is repeated per Package here.
        input: { type: object, additionalProperties: false, properties: {} }
        output:
          type: object
          required: [packages]
          properties:
            packages:
              type: array
              items:
                type: object
                required: [path, name]
                properties:
                  path: { type: string }
                  name: { type: string }
                  digest: { type: string, description: "The latest build, absent for a Package nothing has built" }
      pkg_inspect:
        description: >
          Manifest, build history and provenance of one Package. Builds are
          newest first. For a Package under /org the local image store is
          merged with the builds kitbashd recorded, so a build carries the
          member who made it and a build another member has is listed even
          though this member's store does not hold it, see PLAN.md section 2.2.
          The manifest is answered as it is written, so a unit's hostname, the
          secrets it declares and its permits block are all read here: what a
          Package asks for is part of reading it.
        input: { type: object, additionalProperties: false, required: [path], properties: { path: { type: string } } }
        output:
          type: object
          required: [path, manifest, builds]
          properties:
            path: { type: string }
            manifest: { type: object }
            builds:
              type: array
              items: { type: object, required: [digest, commit, builtAt], properties: { digest: { type: string }, commit: { type: string }, builtAt: { type: string, format: date-time }, builder: { type: string, description: "The member who built it, for a Package under /org" } } }
        errors: [not-found, not-visible, not-permitted, invalid-path, invalid-manifest, internal]

  # ---------------------------------------------------------------- proc (M2)
  proc:
    description: Processes. A Package running as a rootless container under the caller.
    implemented_in: M2
    tools:
      proc_run:
        description: >
          Start a Process from a Package digest, or converge an existing one
          with the same name to that digest. Idempotent: same name and digest
          returns the running Process, a different digest replaces it. The
          container is named kitbash-<package>-<name> and labelled kitbash.id,
          kitbash.user, kitbash.package, kitbash.name and kitbash.digest. With
          expose: mcp the manifest's tools join the caller's surface, see
          $package_tools. A Process is identified by its Package path, not by
          its container name: a name already held by a Process of another
          Package is a conflict, and so is a tool name another running Process
          already answers, which leaves the Process running with its tools off
          the surface. Version 1 runs the first container unit. Before the
          container starts the Process is registered with kitbashd, which
          mints its Telemetry token; the container receives
          KITBASH_TELEMETRY_ENDPOINT, KITBASH_TELEMETRY_TOKEN, KITBASH_PROCESS,
          KITBASH_PACKAGE, KITBASH_USER and KITBASH_MCP_ENDPOINT, see
          spec/kitbashd-api.yaml; through the last one a Process reaches this
          same surface as its owner. A
          Process whose manifest declares subscriptions: [telemetry] with
          expose: http and a port is registered as a fan out subscriber.

          Without a digest the latest build of the Package runs, and latest is
          the image with the newest creation time at nanosecond resolution.
          Two images created in the same nanosecond are decided by the build
          record kitbashd holds, newest first, and a pair neither can separate
          is decided by the higher digest, so the same call picks the same
          image every time. The digest that was picked is in the Process this
          returns and in the registration kitbashd holds.

          A unit whose runner names a Package folder is started by that kit
          instead of by the built in runner, see $package_tools.run_hook. The
          kit has to be running as a Process of the caller: a runner that is
          not is not-found, and a run tool whose schema does not accept the
          hook's arguments is invalid-manifest. The Process the kit answers
          with is registered with its runner and reported with it, and
          kitbashd supervises none of it.

          A unit with expose: none may declare deploy.units[0].schedule, five
          cron fields, minute hour day-of-month month day-of-week, read in
          UTC. proc_run then registers a job: it resolves the digest, builds
          nothing further, starts no container, and answers state scheduled
          with nextRun, the tick kitbashd will start it at, RFC 3339 in UTC.
          kitbashd starts the container at each tick as the owner, through the
          same four steps any start takes and with the same environment,
          secrets, mounts, cgroup ceiling and Telemetry token, and the run is
          over when the entrypoint exits. Every tick writes one
          kitbash.schedule metric record, see tel_query. A tick that arrives
          while the previous run is still going is skipped and recorded, at
          most eight scheduled runs go at once on a host and at most three of
          those are one member's, a tick beyond either is skipped as busy, a
          run longer than six hours is stopped and recorded with exit code 137,
          and ticks missed while the host was down are not made up. Converging is the same rule as any Process:
          the same Package, name and digest is the same job, a new digest
          replaces it. The dialect is *, a number, a range a-b, a step */s or
          a-b/s and comma separated lists of those; names are not accepted,
          the expression is one line, and day of week takes 0 to 7, both 0 and
          7 meaning Sunday. When both day fields are restricted a day matches
          if either does, and a day field beginning with * is not a
          restriction whatever step follows it. A schedule on
          a unit that is not expose: none, or beside health, restart or
          provides.subscriptions, is invalid-manifest; one on a unit that
          names a runner is not-permitted; and a member may hold 32 scheduled
          Processes, beyond which registering one is conflict, the same answer
          the 64 Process limit gives.

          A unit whose deploy.units[0].mounts declares folders of Files gets
          them as bind mounts, at most four, each one nosuid, nodev, noexec
          and non recursive. A source is a folder under the caller's own home
          or a top level folder of /org, and it has to be visible by the rule
          the fs family reads by: it, or a folder between it and its root,
          carries a kitbash.yaml with a name and a description, so the folders
          inside a Package are mountable and a folder with no manifest
          anywhere above it is not. mode rw
          is allowed only under the caller's own home: /org is read only for
          everyone, admins included, because an approval is how a member
          writes there. Mounts are independent of provides.permits, which
          govern what the Process may call back over /mcp; a mount is a kernel
          fact the Process needs no permit for. What a container writes into a
          home leaves the working tree dirty and makes no commit, so fs_read
          sees the file at once and fs_history does not, see PLAN.md 2.1.

          kitbashd resolves every source as root, at registration and again at
          every start, beneath /home/<owner> or /org with the kernel refusing
          to follow a symlink or leave the root. The problems are: another
          member's home, a source the caller does not own, or mode rw on /org
          are not-permitted; a source carrying .., one that resolves through a
          symlink, and one that is not a directory are invalid-path; a source
          with no manifest describing it, its own or one above it, is
          not-visible; a target that is relative, that is /, or that lands under /proc, /sys, /dev, /etc,
          /bin, /sbin, /usr, /lib or /lib64, and more than four mounts, are
          bad-request. A mount that is no longer legal at the next boot fails
          the restore, and proc_list reports that Process failed with the
          reason.

          A unit with expose: http is served by kitbashd's reverse proxy when
          the host has a domain, KITBASH_DOMAIN at install: the Process is
          reached at https://<name>.<member>.<domain>, or at the
          deploy.units[0].hostname the unit declared, and that address is the
          url this returns. The member's label is the attribution: whose work
          a service is, is visible in its address. A host with no domain
          routes nothing and answers no url, and the Process keeps its
          internal endpoint, which is how kitbash worked before the proxy
          existed. A hostname under the host's domain, the domain itself
          included, and one that is an address written out, are both
          invalid-manifest: under the domain a Process is served at
          <name>.<member>.<domain> and nothing else, so no member takes the
          apex or a neighbour's address. A hostname another Process on this
          host already serves, its declared name or the name derived for it,
          is conflict; one on a unit that is not expose: http is bad-request;
          one on a unit that names a runner is not-permitted, because a
          Process a run kit owns has no container here to forward to; one on a
          unit that declares provides.subscriptions is invalid-manifest,
          because a subscriber is a receiver for kitbashd and is not
          published. A unit with subscriptions is exposed over HTTP so
          kitbashd has a port to POST records to, so it is served under no
          name and this answers no url for it, whether or not the host has a
          domain. What
          makes a declared name the member's is that it points here: kitbashd
          resolves it at proc_run and at every start and serves it only while
          it answers with an address of this host, or is a CNAME to the
          derived name; anything else is not-permitted naming what it resolved
          to, and a name that stops pointing here fails the next restore with
          that as the Process's problem. The proxy routes by host name
          to the port that Process's own container publishes, the same port
          the health probe is held to, and writes one span per forwarded
          request, see reverse_proxy in spec/kitbashd-api.yaml.

          The bind mounts are held to what kitbashd validated in the
          container's own mount namespace before its first instruction runs:
          the container is made, the runtime prepares it, kitbashd reads it,
          and only then is it started. A source replaced while podman was
          resolving it is refused, not reported: not-permitted with the detail
          "the mount source changed between validation and start", and that
          container is removed having executed nothing.
        input:
          type: object
          additionalProperties: false
          required: [package]
          properties:
            package: { type: string, description: "Package path" }
            digest: { type: string, pattern: "^sha256:[a-f0-9]{64}$", description: "Defaults to the latest build, see the description for how latest is decided" }
            name: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 64, description: "Defaults to the package name" }
        output:
          type: object
          required: [id, name, package, digest, state]
          properties:
            id: { type: string, description: "UUIDv7" }
            name: { type: string }
            package: { type: string }
            digest: { type: string }
            state: { type: string, enum: [starting, running, unhealthy, stopped, failed, scheduled] }
            expose: { type: string, enum: [mcp, http, none] }
            endpoint: { type: string, description: "Internal URL when expose is http" }
            schedule: { type: string, description: "The cron expression this Process is a job of, absent for a Process that stays up" }
            nextRun: { type: string, format: date-time, description: "When kitbashd runs this job next, UTC" }
            lastRun:
              type: object
              description: >
                The run this job finished most recently. Absent until it has run once
                under the daemon that is answering, which holds the runs it saw the way
                it holds health readings.
              required: [startedAt, exitCode, durationMs]
              properties:
                startedAt: { type: string, format: date-time }
                exitCode: { type: integer }
                durationMs: { type: integer }
            url: { type: string, description: "The address this Process is reached at from outside the host, https://<name>.<member>.<domain> or the hostname the unit declared. Absent on a host with no domain, which routes nothing, and on a unit that declares subscriptions, which is a receiver for kitbashd and is not published" }
            tools: { type: array, items: { type: string }, description: "Surface tool names added when expose is mcp" }
            runner: { type: string, description: "Package path of the run kit that owns this Process, absent when kitbashd runs it" }
            mounts:
              type: array
              description: "The folders of Files this Process sees, as kitbashd resolved them"
              items:
                type: object
                required: [source, target, mode]
                properties:
                  source: { type: string, description: "Absolute host path, resolved" }
                  target: { type: string, description: "Where the container sees it" }
                  mode: { type: string, enum: [ro, rw] }
        errors: [not-found, not-visible, not-permitted, invalid-path, invalid-manifest, conflict, internal]
      proc_list:
        description: >
          Processes owned by the caller, running or stopped. Admins see all
          from M5. With a package it answers that Package's Processes in full,
          and without one it answers every Process as a single line of id,
          name, package, state, exposure and, for an http Process on a host
          with a domain, its url, which is what naming one to ask about takes.
          A package naming no Process answers an empty listing rather than a
          problem. The runtime is read once either way.
          The container runtime holds the state; a Process kitbashd
          could not bring back at the last boot is reported failed with
          problem and fix, because its container sits in the runtime looking
          like one on its way up, see restore in spec/kitbashd-api.yaml. A
          Process whose manifest declares a health path carries the most recent
          probe kitbashd ran, see health_probes there. A Process that declared
          mounts carries them as kitbashd resolved them, which is how a member
          reads what folders of Files their Process can see; one whose mount is
          no longer legal is reported failed with that as its problem. A
          Process with expose: http on a host that has a domain carries the
          url it is reached at, which is the address a member hands to
          somebody else, see proc_run. A Process whose unit declares a
          schedule is scheduled between its runs and running during one, and
          carries schedule, nextRun and, once it has run under the daemon that
          is answering, lastRun with the exit code and how long it took; the
          runs before that are kitbash.schedule records, which is where a
          job's history is.
        input:
          type: object
          additionalProperties: false
          properties:
            package: { type: string, description: "Package path. Omit for one line per Process." }
        output:
          type: object
          required: [processes]
          description: >
            One line per Process without a package, and the full shape below
            with one.
          properties:
            processes:
              type: array
              items:
                type: object
                required: [id, name, package, state]
                properties:
                  id: { type: string }
                  name: { type: string }
                  package: { type: string }
                  digest: { type: string, description: "Absent from a line" }
                  state: { type: string, enum: [starting, running, unhealthy, stopped, failed, scheduled] }
                  expose: { type: string, enum: [mcp, http, none] }
                  url: { type: string, description: "Where an http Process is served, when the host has a domain" }
                  schedule: { type: string, description: "The cron expression this Process is a job of, absent for a Process that stays up" }
                  nextRun: { type: string, format: date-time, description: "When kitbashd runs this job next, UTC" }
                  lastRun:
                    type: object
                    description: >
                      The run this job finished most recently. Absent until it has run once
                      under the daemon that is answering, which holds the runs it saw the way
                      it holds health readings.
                    required: [startedAt, exitCode, durationMs]
                    properties:
                      startedAt: { type: string, format: date-time }
                      exitCode: { type: integer }
                      durationMs: { type: integer }
                  startedAt: { type: string, format: date-time }
                  problem: { type: string, description: "Why this Process is not running, when kitbashd could not bring it back" }
                  fix: { type: string, description: "What the owner can do about it" }
                  runner: { type: string, description: "Package path of the run kit that owns this Process, absent when kitbashd runs it" }
                  mounts:
                    type: array
                    description: >
                      The folders of Files this Process sees, as the registration kitbashd holds
                      records them. Absent for a Process that declared none.
                    items:
                      type: object
                      required: [source, target, mode]
                      properties:
                        source: { type: string }
                        target: { type: string }
                        mode: { type: string, enum: [ro, rw] }
                  health:
                    type: object
                    description: >
                      The most recent health probe kitbashd ran, for a Process kitbashd runs
                      itself whose manifest declares deploy.units[0].health.http. Absent until
                      it has been probed once.
                    required: [healthy]
                    properties:
                      last: { type: string, format: date-time }
                      healthy: { type: boolean }
      proc_stop:
        description: >
          Stop a Process. It stays known and can be run again with proc_run.
          Its tools leave the surface. A Process a run kit owns is stopped
          through that kit's stop tool, see $package_tools.run_hook; a kit that
          declares no stop tool owns a Process kitbash cannot stop, which is
          not-permitted with a fix naming the kit. Stopping a scheduled
          Process unregisters the schedule, so no tick runs it again, and
          removes the container its last run left behind.
        input: { type: object, additionalProperties: false, required: [id], properties: { id: { type: string } } }
        output: { type: object, required: [id, state], properties: { id: { type: string }, state: { type: string } } }
        errors: [not-found, not-permitted, invalid-manifest, internal]
      proc_logs:
        description: >
          Recent stdout and stderr of a Process. Structured logs are in
          Telemetry; this is the raw stream. For a scheduled Process it is the
          last run: the container of a run is kept until the next tick replaces
          it, and a job whose first tick has not come has no output, which is
          not-found saying so.
        input: { type: object, additionalProperties: false, required: [id], properties: { id: { type: string }, lines: { type: integer, minimum: 1, default: 200, maximum: 5000 } } }
        output: { type: object, required: [id, lines], properties: { id: { type: string }, lines: { type: array, items: { type: string } } } }
        errors: [not-found, not-permitted, internal]

  # ---------------------------------------------------------------- tel (M3)
  tel:
    description: >
      Telemetry. OTLP in, queryable out. Every record carries user, package,
      process and, where relevant, path. kitbash-mcp forwards both tools to
      kitbashd over its unix socket, see spec/kitbashd-api.yaml; the caller's
      identity is the socket's peer credentials.
    implemented_in: M3
    tools:
      tel_query:
        description: >
          Query spans, logs or metrics by attributes and time range, newest
          first. A member sees only their own records: user defaults to the
          caller and naming another member is not-permitted. An admin may name
          any member or omit user for the whole machine. since defaults to 24
          hours ago, until to now. Metrics are accepted by the store but no
          producer emits them before M4, so that signal returns an empty page.
          The metrics kitbashd writes itself are kitbash.health, one per probe,
          and kitbash.schedule, one per tick of a scheduled Process: asking
          whether a job ran this morning is
          {signal: metrics, process: <id>, since: <this morning>}, whose
          records carry kitbash.schedule.result, one of ran, skipped,
          failed_to_start, interrupted and lost, kitbash.schedule.duration_ms,
          kitbash.schedule.exit_code on a run that reached one,
          kitbash.schedule.reason on a skipped tick, running or busy, and
          kitbash.schedule.error on a lost one, no-container, timeout or
          runtime.
        input:
          type: object
          additionalProperties: false
          required: [signal]
          properties:
            signal: { type: string, enum: [traces, metrics, logs] }
            user: { type: string, description: "Linux user name; admins only when it is not the caller" }
            package: { type: string, description: "Package path, as kitbash.package" }
            process: { type: string, description: "Process id, as kitbash.process" }
            path: { type: string, description: "Files path, as kitbash.path; prefix match" }
            tool: { type: string, description: "Surface tool name, as kitbash.tool" }
            eval: { type: boolean, description: "Only evaluation results written back by kits" }
            producer: { type: string, description: "Member name or Process id that wrote the record" }
            caller: { type: string, description: "Process id whose MCP session recorded the span, as kitbash.caller" }
            internal: { type: boolean, description: "Only the causes of internal problems, which admins alone read; a member's query never returns them" }
            since: { type: string, format: date-time }
            until: { type: string, format: date-time }
            limit: { type: integer, minimum: 1, default: 100, maximum: 1000 }
        output:
          type: object
          required: [signal, records, truncated]
          properties:
            signal: { type: string }
            truncated: { type: boolean, description: "true when more records matched than limit" }
            records:
              type: array
              items:
                oneOf:
                  - $ref: "#/$defs/spanRecord"
                  - $ref: "#/$defs/logRecord"
                  - $ref: "#/$defs/metricRecord"
        errors: [bad-request, not-permitted, internal]
      tel_retention:
        description: >
          Read the retention window per signal, as a duration such as 720h or
          30d. With set, an admin changes one or more windows; kitbashd deletes
          older records on its next sweep. Defaults are traces 30d, logs 14d,
          metrics 30d.
        input:
          type: object
          additionalProperties: false
          properties:
            set:
              type: object
              additionalProperties: false
              properties:
                traces: { type: string, pattern: "^[0-9]+(h|d)$" }
                metrics: { type: string, pattern: "^[0-9]+(h|d)$" }
                logs: { type: string, pattern: "^[0-9]+(h|d)$" }
        output: { type: object, required: [traces, metrics, logs], properties: { traces: { type: string }, metrics: { type: string }, logs: { type: string } } }
        errors: [bad-request, not-permitted, internal]

  # ---------------------------------------------------------------- users (M5)
  users:
    description: Organization members. Linux users with SSH keys. Admin only except users_me. Served by kitbashd over its socket, see spec/kitbashd-api.yaml.
    implemented_in: M5
    tools:
      users_me:
        description: Who am I and what groups am I in. Answered by kitbashd from the socket's peer credentials.
        input: { type: object, additionalProperties: false, properties: {} }
        output: { type: object, required: [user, uid, admin], properties: { user: { type: string }, uid: { type: integer }, admin: { type: boolean }, groups: { type: array, items: { type: string } } } }
      users_create:
        description: >
          Create a member with an SSH public key, a private home and a
          subordinate id range, through kitbashd. Admin only. The member can
          connect immediately; their home is a root for Files and starts
          empty.
        input: { type: object, additionalProperties: false, required: [name, sshKey], properties: { name: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }, sshKey: { type: string, maxLength: 4096, description: "One OpenSSH public key line" }, admin: { type: boolean, default: false } } }
        output: { type: object, required: [user, uid, admin], properties: { user: { type: string }, uid: { type: integer }, admin: { type: boolean } } }
        errors: [bad-request, not-permitted, conflict, internal]
      users_list:
        description: All members with uid, admin flag, key count and running Process count. Admin only.
        input: { type: object, additionalProperties: false, properties: {} }
        output: { type: object, required: [users], properties: { users: { type: array, items: { type: object, required: [user, uid, admin], properties: { user: { type: string }, uid: { type: integer }, admin: { type: boolean }, keys: { type: integer }, processes: { type: integer } } } } } }
        errors: [not-permitted, internal]
      users_add_key:
        description: Add an SSH public key to a member. Admin only. A key already present is not added twice.
        input: { type: object, additionalProperties: false, required: [name, sshKey], properties: { name: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }, sshKey: { type: string, maxLength: 4096 } } }
        output: { type: object, required: [user, keys], properties: { user: { type: string }, keys: { type: integer } } }
        errors: [bad-request, not-permitted, not-found, internal]
      users_remove:
        description: >
          Remove a member. Admin only. Their Processes stop and are
          unregistered, their sessions end, their home is archived under
          /org/.archive/<name> where the surface cannot see it, and the
          account is deleted. An admin cannot remove themselves or the last
          admin.
        input: { type: object, additionalProperties: false, required: [name], properties: { name: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" } } }
        output: { type: object, required: [user, archived], properties: { user: { type: string }, archived: { type: string } } }
        errors: [not-permitted, not-found, conflict, internal]

  # ---------------------------------------------------------------- approvals (M5)
  approvals:
    description: >
      The replacement for sudo. Operations outside the caller's own space, such
      as writes to /org by a regular user, are queued here instead of failing.
      An admin approves or rejects through the same surface.
    implemented_in: M5
    tools:
      approvals_list:
        description: Approvals by state. Members see their own, admins see all. An executed approval carries the tool's result, a normal output or a problem.
        input: { type: object, additionalProperties: false, properties: { state: { type: string, enum: [pending, approved, rejected], default: pending } } }
        output: { type: object, required: [approvals], properties: { approvals: { type: array, items: { type: object, required: [id, requester, tool, input, state, requestedAt], properties: { id: { type: string }, requester: { type: string }, tool: { type: string, enum: [fs_write, pkg_import] }, input: { type: object }, state: { type: string, enum: [pending, approved, rejected] }, requestedAt: { type: string, format: date-time }, decidedAt: { type: string, format: date-time }, decidedBy: { type: string }, note: { type: string }, reason: { type: string }, result: { type: object } } } } } }
        errors: [not-permitted, internal]
      approvals_approve:
        description: >
          Approve and execute a queued operation. Admin only. The tool runs in
          the admin's session as the admin's Linux user; a commit is authored
          by the requester with an Approved-by trailer naming the admin. The
          result, a normal output or a problem, is returned here and stored on
          the approval for the requester.
        input: { type: object, additionalProperties: false, required: [id], properties: { id: { type: string }, note: { type: string, maxLength: 500 } } }
        output: { type: object, required: [id, state, result], properties: { id: { type: string }, state: { type: string, enum: [approved] }, result: { type: object } } }
        errors: [not-permitted, not-found, conflict, internal]
      approvals_reject:
        description: Reject a queued operation with a reason the requester will see. Admin only.
        input: { type: object, additionalProperties: false, required: [id, reason], properties: { id: { type: string }, reason: { type: string, minLength: 3, maxLength: 500 } } }
        output: { type: object, required: [id, state], properties: { id: { type: string }, state: { type: string, enum: [rejected] } } }
        errors: [not-permitted, not-found, conflict, internal]

  # ---------------------------------------------------------------- secrets (M9)
  secrets:
    description: >
      The values a member gives their own Processes: an API key, a token for a
      service outside this machine. A unit declares the names it needs in
      deploy.units[].secrets and kitbashd resolves each one to the owner's
      current value at every start, so rotation is one call and nothing is
      rebuilt. Served by kitbashd over its socket, see
      spec/kitbashd-api.yaml.

      Secrets are the member's own, scoped by the socket's peer credentials
      the same way their home is: an admin holds their own set and reads
      nobody else's, and there is no shared set, because a Process runs under
      one member and the value has to be that member's to give. kitbashd keeps
      them as root owned files outside the database, so the daily backup copy
      carries none of them, and removes a member's set with their account, see
      PLAN.md sections 2.3 and 4.7.

      A value crosses the wire once, on secrets_set. The span that call
      records carries the name and no value, no problem detail quotes one,
      and no value is ever on podman's command line or in the request body of
      proc_run: kitbashd writes the environment file itself.
    implemented_in: M9
    tools:
      secrets_set:
        description: >
          Set the value of one secret of the caller. Creating and replacing are
          the same call, so rotation is one call: secrets_set writes the new
          value and the next start of every Process that declares the name
          reads it. It restarts nothing, as a health probe restarts nothing;
          proc_stop followed by proc_run is how a member decides which
          Processes take a new value. The value is one line: at most 8192
          bytes, no NUL and no line break, because the environment file a
          Process is given is line based. A multi line credential is encoded
          by the member before it is set.
        input: { type: object, additionalProperties: false, required: [name, value], properties: { name: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }, value: { type: string, minLength: 1, maxLength: 8192, description: "The value, 1 to 8192 bytes, without NUL and without a line break" } } }
        output: { type: object, required: [name, updated], properties: { name: { type: string }, updated: { type: string, format: date-time } } }
        errors: [bad-request, internal]
      secrets_list:
        description: >
          The names the caller holds and when each was last written, sorted by
          name. It never answers a value: what a listing is for is seeing
          which names are there.
        input: { type: object, additionalProperties: false, properties: {} }
        output: { type: object, required: [secrets], properties: { secrets: { type: array, items: { type: object, required: [name, updated], properties: { name: { type: string }, updated: { type: string, format: date-time } } } } } }
        errors: [internal]
      secrets_remove:
        description: >
          Drop one secret of the caller. Idempotent: a name the caller does not
          hold answers removed false rather than failing. A Process that
          declares the name keeps running with the value it was started with,
          and its next start is not-found until the name is set again.
        input: { type: object, additionalProperties: false, required: [name], properties: { name: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" } } }
        output: { type: object, required: [name, removed], properties: { name: { type: string }, removed: { type: boolean } } }
        errors: [bad-request, internal]
