name: pair
description: >-
  The end to end fixture Package for composition: two units of one Package, a
  counter that answers over HTTP and the cache it keeps its count in. They run
  as one pod and reach each other on localhost, see PLAN.md section 5.6.
tags: [e2e, fixture]

deploy:
  units:
    # The face. It is the unit the Process is reached, probed and routed by,
    # and the only one that declares an exposure.
    - name: web
      type: container
      build: .
      expose: http
      port: 8080
      environment: { CACHE_PORT: "6379" }
      limits: { memory: "256Mi" }
      # The probe is what stamps kitbash.unit on a record of one unit: the
      # daemon requests this path on the face and writes one kitbash.health
      # metric carrying the unit it read, which is what tel_query filters by.
      health: { http: /healthz, interval: 5s }
    # The sidecar. It is an upstream image pinned by digest rather than a build
    # of this Package, which is the other half of what a unit may be.
    - name: cache
      type: container
      image: docker.io/library/redis@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
      # No persistence: the count of one end to end run lives as long as the
      # pod does, and an append log would write a file nothing reads. The
      # snapshots the image is configured for are switched off by the same
      # word rather than by an empty one, which no unit may declare.
      command: [redis-server, --appendonly, "no", --save, "900000000", "1"]
      limits: { memory: "128Mi" }
