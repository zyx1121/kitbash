name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Lint, test and build
        run: make lint test test-race build-linux

      - uses: actions/upload-artifact@v4
        with:
          name: kitbash-mcp-linux-amd64
          path: bin/kitbash-mcp-linux-amd64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: kitbashd-linux-amd64
          path: bin/kitbashd-linux-amd64
          if-no-files-found: error
